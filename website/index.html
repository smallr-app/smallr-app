<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>DMPR | See in monochrome</title>
	<meta name="description"
		content="DMPR is an iOS monochrome camera app that let you see the black-and-white. Exposure, Filter, Look, and Tone are decided before capture." />
	<meta name="theme-color" content="#12110e" />
	<meta property="og:title" content="DMPR" />
	<meta property="og:description" content="A dedicated iPhone camera built around seeing monochrome." />
	<meta property="og:type" content="website" />
	<meta property="og:image" content="./images/post.avif" />
	<link rel="stylesheet" href="./styles.css" />
</head>

<body>
	<header class="site-header" id="top">
		<a class="brand" href="#top" aria-label="DMPR home">DMPR</a>
	</header>

	<main>
		<section class="hero section" aria-labelledby="hero-title">
			<div class="hero-copy">
				<img class="app-icon" src="./images/dmpr.avif" alt="DMPR app icon" />
				<h1 id="hero-title">See in monochrome.</h1>
				<p class="hero-text">
					DMPR is a dedicated iOS camera app with a live monochrome preview,
					it allows you to build your flavor with Filter, Look, and Tone.
				</p>
				<div class="hero-actions">
					<a href="https://apps.apple.com/us/app/dmpr/id6777109237" class="app-store-link" target="_blank"
						rel="noopener">
						<img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg"
							alt="Download on the App Store" class="app-store-badge">
					</a>
				</div>
				<p class="hero-note">No account required. No network required.</p>
			</div>

			<div class="hero-visual" aria-label="DMPR preview and app icon">
				<figure class="main-shot">
					<img class="post-image" src="./images/post.avif" alt="Black-and-white sample photograph created with DMPR" />
				</figure>
			</div>
		</section>
	</main>
</body>

</html>
